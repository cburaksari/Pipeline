<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:h="http://java.sun.com/jsf/html"> 

<h:head></h:head> 
<body> 
<form id="loginForm" method="post" action="#{request.contextPath}/j_spring_security_check">
		<h3>JSF Login Logout</h3>
		<h:outputText value="Username" />
		<h:inputText id="username"></h:inputText>
		<br></br><br></br>
		
		<h:outputText value="Password" />
		<h:inputSecret id="password" ></h:inputSecret>
		<br></br><br></br>
		
		<h:commandButton id="login" action="#{security.doLogin}"
			value="Login"></h:commandButton>
	</form>
</body> 
</html>
