<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd"> 
<html xmlns="http://www.w3.org/1999/xhtml"
 xmlns:h="http://java.sun.com/jsf/html"
 xmlns:f="http://java.sun.com/jsf/core"
 xmlns:ui="http://java.sun.com/jsf/facelets"
 xmlns:ez="http://java.sun.com/jsf/composite/ezcomp"
      xmlns:p="http://primefaces.org/ui"> 

<h:head></h:head> 
<h:body> 
<h:form>
<p:growl id="msg" closable="true" showDetail="true"></p:growl>
<p:panelGrid columns="2">
<h:outputLabel value="Category Name: " />
<p:selectOneMenu value="#{subCategoryService.catName}">
<f:selectItems value="#{subCategoryService.categories}"/>
</p:selectOneMenu>
<h:outputLabel value="Sub Category Name: " />
<h:inputText value="#{subCategoryService.subCategory.catName}" />
<h:outputLabel value="Sub Category Des: " />
<h:inputText value="#{subCategoryService.subCategory.catDesc}" />

<p:commandButton action="#{subCategoryService.addSubCategory}" value="Save" update="msg"></p:commandButton>

</p:panelGrid>
</h:form>


</h:body> 
</html>
